<!doctype html>
<html><head><meta charset="utf-8"><title>Dev Companion</title>
<style>
  body { font: 13px 'Segoe UI', system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #20252d; }
  h1 { font-size: 14px; margin: 0 0 4px; } p { margin: 0 0 12px; color: #6b7682; font-size: 11px; line-height: 1.4; }
  label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .6px; color: #8b949f; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #dfe3e7; border-radius: 7px; font: inherit; }
  button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 7px; background: #202b35; color: #fff; font-weight: 700; cursor: pointer; }
  .status { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: #f3f5f7; font-size: 12px; }
  .status.on { background: #e6f3ea; color: #2f6b47; }
</style></head>
<body>
  <h1>Dev Companion Bridge</h1>
  <p>Desktop app → Security &amp; activity → Browser bridge se pairing token copy karke yahan paste karo. Password / card / OTP fields kabhi app ko nahi bheje jaate.</p>
  <label for="token">PAIRING TOKEN</label><input id="token" type="password" autocomplete="off" spellcheck="false">
  <label for="port">PORT</label><input id="port" type="number" value="47821">
  <button id="save">Save &amp; connect</button>
  <div id="status" class="status">…</div>
  <script src="popup.js" type="module"></script>
</body></html>
