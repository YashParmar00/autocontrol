name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - name: Zip the Chrome extension
        shell: pwsh
        run: Compress-Archive -Path apps/browser-extension/* -DestinationPath release/dev-companion-chrome-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dev-companion-windows
          path: |
            release/*.exe
            release/dev-companion-chrome-extension.zip
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/dev-companion-chrome-extension.zip
